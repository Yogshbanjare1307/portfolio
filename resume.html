<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Yogesh Banjare</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: var(--bg-primary); /* Matches the main theme */
        }
        .resume-container {
            max-width: 1000px;
            margin: 150px auto 100px;
            padding: 0 5%;
            text-align: center;
            animation: fadeUp 1s ease forwards;
        }
        .resume-viewer {
            width: 100%;
            height: 85vh;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-card);
            margin-bottom: 2rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }
        .resume-viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white; /* Most resumes are white */
        }
        .resume-upload-instructions {
            background: rgba(139, 92, 246, 0.05);
            border: 1px dashed rgba(139, 92, 246, 0.4);
            padding: 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
        }
        .resume-upload-instructions code {
            background: rgba(0,0,0,0.5);
            padding: 0.3rem 0.6rem;
            border-radius: 4px;
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }
        .resume-actions {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <span class="nav-logo-icon">YB</span>
                <div class="nav-logo-text">
                    <span class="nav-logo-name">YOGESH BANJARE</span>
                    <span class="nav-logo-title">VIDEO EDITOR</span>
                </div>
            </a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html#hero" class="nav-link">HOME</a></li>
                <li><a href="index.html#about" class="nav-link">ABOUT</a></li>
                <li><a href="index.html#work" class="nav-link">WORK</a></li>
                <li><a href="index.html#skills" class="nav-link">SKILLS</a></li>
                <li><a href="index.html#ai-tools" class="nav-link">AI TOOLS</a></li>
                <li><a href="resume.html" class="nav-link active">RESUME</a></li>
                <li><a href="index.html#contact" class="nav-link">CONTACT</a></li>
            </ul>
        </div>
    </nav>

    <!-- Resume Section -->
    <div class="resume-container">
        <div class="section-header-center" style="margin-bottom: 2.5rem;">
            <p class="section-label">MY EXPERTISE</p>
            <h2 class="section-title">PROFESSIONAL <span class="text-gradient">RESUME</span></h2>
        </div>
        
        <div class="resume-upload-instructions">
            <!-- <h3 style="color: var(--text-primary); margin-bottom: 10px; font-size: 1.2rem;">
                <i class="fas fa-file-pdf" style="color: var(--accent); margin-right: 10px;"></i>
                How to display your actual resume here:
            </h3> -->
            <!-- <p style="font-size: 0.95rem; line-height: 1.6;">
                Save your resume as a PDF file, rename it exactly to <code>resume.pdf</code>, and drop it into your <code>assets/</code> folder. 
                Once you do that, it will automatically appear in the viewer below!
            </p> -->
        </div>

        <div class="resume-viewer">
            <!-- This iframe tries to load the PDF from the assets folder -->
            <iframe src="assets/resume.pdf" title="Yogesh Banjare Resume">
                Your browser does not support iframes or PDFs. Please download the PDF to view it.
            </iframe>
        </div>

        <div class="resume-actions">
            <!-- Download Button -->
            <a href="assets/resume.pdf" download="Yogesh_Banjare_Resume.pdf" class="btn-primary">
                <span>DOWNLOAD PDF</span>
                <i class="fas fa-download"></i>
            </a>
            <!-- Back Button -->
            <a href="index.html" class="btn-outline">
                <i class="fas fa-arrow-left"></i>
                <span>BACK TO PORTFOLIO</span>
            </a>
        </div>
    </div>

</body>
</html>
